# Настройки чата MineHouse: config/minehouse/chat.toml.
#
# После правки напиши в игре или в консоли /chat reload, перезапуск не нужен.
# Если удалить строку, вернётся значение по умолчанию. Пустое значение "" выключает настройку.
#
# Цвета как в обычном Minecraft: &0..&9 и &a..&f, &l жирный, &o курсив,
# &n подчёркнутый, &m зачёркнутый, &r сброс. Любой цвет: &#a855f7.
#
# Подстановки в форматах:
#   {prefix}  значок роли игрока (раздел [role]), пробел после него ставится сам
#   {name}    ник; при наведении подсказка, клик открывает /msg
#   {message} текст сообщения
#   {target}  ник собеседника в личных сообщениях
#   {group}   первая группа прав игрока (admin, moderator...)
#   {world}   мир, где стоит игрок (названия в разделе [world])
#   {radius}  радиус локального чата

# ---------- Локальный чат ----------
# Всё, что пишется в чат без "!", слышат игроки рядом.
[local]
# Радиус в блоках. Игроки в другом мире не слышат никогда.
radius = 100
format = "&8[&7Л&8] {prefix}&f{name}&8 » &7{message}"
hover = "&7Локальный чат, слышно в радиусе {radius} блоков"
# Если рядом никого не было.
nobody = "&7Рядом никого нет. Начни сообщение с &f!&7, чтобы написать всем."

# ---------- Глобальный чат ----------
# Сообщение, которое начинается с этого символа, видят все. Ещё есть команда /g текст.
[global]
prefix = "!"
format = "&#a855f7[Г] {prefix}&f{name}&8 » &f{message}"
hover = "&7Глобальный чат, видят все"

# ---------- Объявления ----------
# Админ пишет в чат сообщение, начиная с этого префикса, и его получают все игроки сразу:
# со звуком и выделенной строкой в чате. Нужно право minehouse.announce.
# У остальных $$ это обычный текст.
[announce]
prefix = "$$"
# Строка в чате. Сверху и снизу добавляется пустая строка.
format = "&6&l[Объявление] {prefix}&f{name}\n&e&l» &e{message}"
sound = "block.bell.use"
# Надпись по центру экрана, по умолчанию её нет. Можно {name} и {message}.
title = ""
subtitle = ""

# ---------- Личные сообщения ----------
# /msg ник текст (то же самое /tell, /w, /m), ответить последнему: /r текст
[pm]
to = "&#c084fc[Ты → {target}] &f{message}"
from = "&#c084fc[{name} → Тебе] &f{message}"
sound = "entity.experience_orb.pickup"
not_found = "&cИгрок {target} не в сети."
self = "&cСамому себе писать нельзя."
nobody_to_reply = "&cТебе ещё никто не писал."
ignored = "&c{target} не принимает твои сообщения."

# ---------- Упоминания ----------
# Если в сообщении есть ник игрока, ему проигрывается звук.
[mention]
sound = "block.note_block.bell"

# ---------- Игнор ----------
# /ignore ник, повторно, чтобы снять. /ignore без ника покажет список.
[ignore]
added = "&7Ты больше не видишь сообщения {target}."
removed = "&7Сообщения {target} снова видны."
list = "&7Ты игнорируешь: &f{list}"
empty = "&7Ты никого не игнорируешь."

# ---------- Мут ----------
# /mute ник [причина] навсегда, /tempmute ник срок [причина] на время, /unmute ник, /mutelist.
# Сроки: 30m, 12h, 7d, 2w, 1mo, можно складывать: 1d12h.
# Права: minehouse.command.mute, .tempmute, .unmute, .mutelist; из консоли можно всегда.
# Замученный игрок не может писать в локальный и глобальный чат, в ЛС, через /me и /say.
# Подстановки: {player} ник, {reason} причина, {by} кто выдал, {until} до какого времени (МСК),
# {left} сколько осталось.
[mute]
default_reason = "Нарушение правил чата"
done = "&e{player} получил мут навсегда: {reason}"
done_temp = "&e{player} получил мут до {until}: {reason}"
player = "&cТебе выдан мут навсегда. Причина: {reason}"
player_temp = "&cТебе выдан мут на {left} (до {until}). Причина: {reason}"
# Видят все остальные игроки. Пусто, чтобы мут выдавался тихо.
announce = "&7{player} больше не может писать в чат. Причина: {reason}"
announce_temp = "&7{player} не может писать в чат {left}. Причина: {reason}"
blocked = "&cУ тебя мут навсегда, сообщение не отправлено. Причина: {reason}"
blocked_temp = "&cУ тебя мут ещё {left} (до {until}), сообщение не отправлено. Причина: {reason}"
not_found = "&cИгрок {player} ни разу не заходил на сервер."
self = "&cСебе мут выдать нельзя."
bad_duration = "&cНе понял срок «{duration}». Примеры: 30m, 12h, 7d, 2w, 1mo, 1d12h."

[unmute]
done = "&a{player} снова может писать в чат."
player = "&aМут снят, можно снова писать в чат."
not_muted = "&c{player} без мута."

[mutelist]
header = "&eМуты ({count}):"
line = "&f{player}&7: {left}, {reason} &8(выдал {by})"
empty = "&7Мутов нет."

# ---------- Подсказка на нике ----------
[name]
hover = "&7Нажми, чтобы написать в ЛС"

# ---------- Роли ----------
# Значок перед ником для групп прав (config/groups.toml). Если игрок в нескольких группах,
# берётся та, что выше в списке order. Новая группа: добавь её в order и раздел
# [role.имя_группы] со значком badge и подсказкой hover.
[role]
order = ["admin", "moderator", "vip"]

[role.admin]
badge = "&c●"
hover = "&cАдминистратор"

[role.moderator]
badge = "&9●"
hover = "&9Модератор"

[role.vip]
badge = "&6●"
hover = "&6VIP"

# ---------- Миры ----------
# Как называть миры в {world}.
[world]
overworld = "Обычный мир"
the_nether = "Незер"
the_end = "Энд"

# ---------- Служебное ----------
[reload]
done = "&aНастройки чата перечитаны."
failed = "&cНе удалось прочитать настройки: {error}"

[mode]
global = "&7Теперь ты пишешь в &#a855f7глобальный&7 чат. Вернуться: /l"
local = "&7Теперь ты пишешь в локальный чат. В глобальный: /g или ! в начале."
